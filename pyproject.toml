[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rdq"
version = "0.3.3"
description = "Quality and provenance checks for robot-learning datasets (LeRobot format)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "pyyaml>=6",
  "scipy>=1.10",
  "huggingface_hub>=0.30",
]

[project.urls]
Homepage = "https://github.com/s1g6r/rdq"
Documentation = "https://github.com/s1g6r/rdq#readme"
Changelog = "https://github.com/s1g6r/rdq/blob/main/CHANGELOG.md"
"Browser version" = "https://huggingface.co/spaces/rs1g6r/rdq"

[project.optional-dependencies]
dev = ["pytest>=7"]
croissant = ["mlcroissant>=1.0"]
video = ["av>=12", "opencv-python-headless>=4.8"]
mcap = ["mcap>=1.1", "mcap-ros2-support>=0.5"]

[project.scripts]
rdq = "rdq.cli:main"

[tool.setuptools.packages.find]
include = ["rdq*"]

[tool.setuptools.package-data]
rdq = ["data/*.json"]
