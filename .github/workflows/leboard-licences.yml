name: leboard-licences

# Run by hand: rdq's licence check for every dataset on LeBoard, at the commit LeBoard pins.
on:
  workflow_dispatch:

jobs:
  licences:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python experiments/leboard_licences.py
        env: {PART: "0", PARTS: "3"}
      - run: python experiments/leboard_licences.py
        env: {PART: "1", PARTS: "3"}
      - run: python experiments/leboard_licences.py
        env: {PART: "2", PARTS: "3"}
      - uses: actions/upload-artifact@v4
        with:
          name: leboard-licences
          path: leboard_licence_check.csv
